# Include from your .gitlab-ci.yml:
#   include:
#     - local: kit/ci/gitlab/angular-review.gitlab-ci.yml   # or copy this file
#
# 1. angular-review:scan — deterministic, no AI. Produces a Code Quality report shown in the MR widget.
# 2. angular-review:ai   — runs the full skill with Claude Code (headless) and posts REVIEW.md as an MR note.
#    Runs only when ANTHROPIC_API_KEY and GITLAB_REVIEW_TOKEN (scope: api) are defined as masked CI/CD variables,
#    and never for a merge request from a fork (a project member could run it with these variables).
# Prerequisite: the skill is versioned in the repo under .agents/skills/ (node kit/install.mjs --target .).

stages: [review]

.angular-review-base:
  stage: review
  image: node:24
  variables:
    GIT_DEPTH: 0          # scope.mjs needs the merge-base
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["**/*.ts", "**/*.html", "angular.json", "package.json"]
  before_script:
    - git fetch --quiet origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"

angular-review:scan:
  extends: .angular-review-base
  script:
    - node .agents/skills/angular-review/scripts/scope.mjs --committed --quiet
    - node .agents/skills/angular-review/scripts/scan.mjs --format text
    - node .agents/skills/angular-review/scripts/scan.mjs --format gitlab --out gl-code-quality-report.json --fail-on BLOCKER --fail-confidence high
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
    paths: [.review/scan.json]

angular-review:ai:
  extends: .angular-review-base
  needs: ["angular-review:scan"]
  # `rules` replaces the base rules, so the file filter is repeated here. `when: always` keeps the AI review
  # running when the scan gate fails: that is when it matters most.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID && $ANTHROPIC_API_KEY && $GITLAB_REVIEW_TOKEN
      changes: ["**/*.ts", "**/*.html", "angular.json", "package.json"]
      when: always
  variables:
    CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"   # commands the agent runs do not see the API key
  script:
    - npm install -g @anthropic-ai/claude-code
    - test -d .claude/skills || (mkdir -p .claude && cp -r .agents/skills .claude/skills)   # Claude Code reads .claude/skills
    # Least privilege: read, the skill's three scripts, read-only git, writes under .review/ only.
    # The posting token does not exist for the agent: only curl gets it, after the review.
    - >
      env -u GITLAB_REVIEW_TOKEN claude -p "/angular-review Base: origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      (run scope.mjs with --committed). Application code is read-only."
      --allowedTools "Read" "Grep" "Glob" "Edit(.review/**)" "Bash(node .claude/skills/angular-review/scripts/scope.mjs:*)" "Bash(node .agents/skills/angular-review/scripts/scope.mjs:*)" "Bash(node .claude/skills/angular-review/scripts/scan.mjs:*)" "Bash(node .agents/skills/angular-review/scripts/scan.mjs:*)" "Bash(node .claude/skills/angular-review/scripts/findings.mjs:*)" "Bash(node .agents/skills/angular-review/scripts/findings.mjs:*)" "Bash(git diff:*)" "Bash(git log:*)" "Bash(git show:*)" "Bash(git status:*)" "Bash(git rev-parse:*)" "Bash(git merge-base:*)"
    - >
      curl --fail --silent --show-error --request POST
      --header "PRIVATE-TOKEN: $GITLAB_REVIEW_TOKEN"
      --data-urlencode "body@.review/REVIEW.md"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes"
  artifacts:
    when: always
    paths: [.review/]
