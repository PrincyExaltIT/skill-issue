# .github/workflows/angular-review-codex.yml — the same review, run by Codex.
# OpenAI's recommended shape: the agent runs in a READ-ONLY job; a second job, which never runs the agent,
# holds the permission to comment. Requires the OPENAI_API_KEY secret and the skill in .agents/skills/.

name: angular-review-codex

on:
  pull_request:
    paths: ['**/*.ts', '**/*.html', 'angular.json', 'package.json']

jobs:
  review:
    name: Review IA (Codex + skill angular-review)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      report: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: workspace-write
          prompt: |
            Use the $angular-review skill on this pull request.
            Base branch: origin/${{ github.base_ref }} (run scope.mjs with --committed --base origin/${{ github.base_ref }}).
            Application code is read-only. Finish by replying with the full content of .review/REVIEW.md and nothing else.

  post_feedback:
    name: Publier le rapport
    needs: review
    if: ${{ needs.review.outputs.report != '' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        env:
          REPORT: ${{ needs.review.outputs.report }}
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body: process.env.REPORT,
            });
